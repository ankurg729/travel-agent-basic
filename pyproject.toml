[project]
name = "travel-agent-basic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain[mcp]>=1.4.9",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.7.4",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.8",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "streamlit>=1.67.0",
    "tavily-python>=0.8.5",
]

[project.scripts]
travel-agent-basic = "travel_agent_basic:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
