services:
  postgres:
    image: postgres:16-alpine
    container_name: travel-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: langgraph_memory
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d langgraph_memory"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
